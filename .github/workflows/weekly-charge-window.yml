name: Weekly full charge schedule validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/weekly-charge-window.yml
      - custom_components/omnibattery/control/weekly_charge_window.py
      - custom_components/omnibattery/control/weekly_full_charge.py
      - custom_components/omnibattery/time.py
      - custom_components/omnibattery/__init__.py
      - custom_components/omnibattery/frontend/marstek-panel.js
      - tests/test_weekly_charge_window.py
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate frontend and Python syntax
        run: |
          node --check custom_components/omnibattery/frontend/marstek-panel.js
          python -m py_compile custom_components/omnibattery/__init__.py custom_components/omnibattery/time.py custom_components/omnibattery/control/weekly_full_charge.py custom_components/omnibattery/control/weekly_charge_window.py
      - name: Weekly charge time-window tests
        run: |
          python -m pip install pytest pytest-asyncio
          python scripts/test_phase_isolated.py
