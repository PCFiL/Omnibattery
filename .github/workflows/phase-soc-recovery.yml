name: Phase SOC recovery validation
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python scripts/test_phase_recovery_isolated.py --junitxml=test-results/phase-recovery.xml
      - run: node --check custom_components/omnibattery/frontend/tempo-preview.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-recovery-isolated
          path: test-results/
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test_phase_recovery_frontend.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-recovery-browser
          path: test-results/
  ha-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-test.txt
      - run: >-
          python -m pytest -p no:homeassistant
          tests/test_phase_soc_recovery.py tests/test_phase_soc_recovery_runtime.py
          tests/test_phase_soc_recovery_preview.py tests/test_phase_soc_recovery_adapter.py
          tests/test_tempo_preview.py tests/test_tempo_preview_adapter.py tests/test_tempo_preview_sensor.py
          --junitxml=test-results/ha-recovery.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-recovery-ha-dependencies
          path: test-results/
