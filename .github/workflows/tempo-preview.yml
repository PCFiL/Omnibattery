name: Tempo preview validation

on:
  push:
    branches: [main]
    paths:
      - 'custom_components/omnibattery/forecast/**'
      - 'custom_components/omnibattery/sensors/tempo_preview.py'
      - 'custom_components/omnibattery/frontend/tempo-preview.js'
      - 'custom_components/omnibattery/phase_diagnostics.py'
      - 'tests/test_tempo_preview*.py'
      - 'scripts/test_tempo_preview_isolated.py'
      - '.github/workflows/tempo-preview.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pytest
      - run: python scripts/test_tempo_preview_isolated.py
      - run: node --check custom_components/omnibattery/frontend/tempo-preview.js
  ha-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-test.txt
      - name: Adapter and lifecycle contracts with real HA dependencies
        run: >-
          python -m pytest -p no:homeassistant -v
          tests/test_tempo_preview_adapter.py
          tests/test_tempo_preview_sensor.py
